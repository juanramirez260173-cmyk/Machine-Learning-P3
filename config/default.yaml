# ---------------------------------------------------------------------------
# P3 Rank 6 - 8D / PQM Quality-Escalation Agent - default configuration
# "Configuration over custom code": customer-specific templates, thresholds,
# mappings, taxonomies and approval roles are externalised here (Solution Ref 13.1).
# Customer overrides live in config/customers/<customer>.yaml and are deep-merged.
# ---------------------------------------------------------------------------
schema_version: "1.0.0"

llm:
  provider: "auto"            # auto | anthropic | rules  (auto = anthropic if ANTHROPIC_API_KEY else rules)
  model: "claude-opus-5"
  effort: "medium"
  max_tokens: 16000
  prompt_version: "1.0.0"
  # server-side refusal fallback ("default" routes by refusal category)
  fallbacks: "default"
  pricing_usd_per_mtok: { input: 5.0, output: 25.0 }

retrieval:
  top_k: 5
  min_score: 0.05
  embedder: "auto"            # auto | bm25 | sentence-transformers
  sentence_transformer_model: "all-MiniLM-L6-v2"
  allow_cross_customer: false # zero cross-customer leakage by default
  similarity_factors: [failure_mode, process_step, component, symptom, root_cause_family]

# Discipline due dates in calendar days after case opening (customer overrides apply)
discipline_deadlines_days:
  D1: 1
  D2: 2
  D3: 1        # containment within 24 h
  D4: 10
  D5: 15
  D6: 30
  D7: 45
  D8: 60

escalation:
  warn_days_to_due: 5
  critical_days_to_due: 2
  overdue_days_level_2: 3
  overdue_days_level_3: 7
  aging_warn_days: 30
  level_labels:
    0: "None"
    1: "Team - 8D owner / quality lead"
    2: "Management - plant quality manager"
    3: "Executive - customer escalation risk (e.g. CS2 / OEM line stop)"

approvals:
  # decision_type -> roles allowed to approve (any one of them)
  validated_root_cause: [process_engineer, quality_lead]
  containment: [quality_lead, operations_owner, production_representative]
  corrective_action: [process_engineer, quality_lead]
  pfmea_change: [pfmea_moderator]
  control_plan_change: [control_plan_owner]
  work_instruction_change: [work_instruction_owner, process_engineer]
  effectiveness: [8d_owner, customer_quality_lead]
  closure: [quality_lead, customer_quality_lead]
  customer_submission: [customer_quality_lead]
  problem_statement: [8d_owner, quality_lead]
  evidence_set: [8d_owner]

guardrails:
  min_extraction_confidence: 0.70
  # phrases the drafter may not use unless the linked hypothesis is VALIDATED with an approval
  forbidden_conclusive_phrases:
    - "root cause is confirmed"
    - "confirmed root cause"
    - "root cause was confirmed"
    - "root cause has been confirmed"
    - "proven root cause"
    - "root cause is proven"
    - "validated root cause"
    - "definitively caused by"
  require_citation_kinds: [fact]
  citation_coverage_target: 0.95

read_across:
  fuzzy_match_threshold: 0.50
  checklist:
    - id: RA-1
      document_type: pfmea
      requirement: "Validated failure mode and effect are represented in the PFMEA at the correct process step"
    - id: RA-2
      document_type: pfmea
      requirement: "Validated occurrence cause is represented and its prevention control is documented"
    - id: RA-3
      document_type: pfmea
      requirement: "Validated escape mechanism is represented and its detection control is documented"
    - id: RA-4
      document_type: control_plan
      requirement: "Control Plan characteristic, method, frequency, sample size and reaction plan match the approved action"
    - id: RA-5
      document_type: work_instruction
      requirement: "Work Instruction / standardised work reflects operator-facing changes"
    - id: RA-6
      document_type: pfmea
      requirement: "Revision / effective date and implementation evidence are available before closure"

d2_mandatory_fields: [who, what, where, when, why_problem, how_detected, how_many]

evidence_requirements_by_discipline:
  D2: [complaint_record, photo, measurement_report]
  D3: [containment_result, genealogy]
  D4: [test_report, measurement_report]
  D6: [test_report, action_tracker]
  D7: [pfmea, control_plan, work_instruction]

ml:
  due_date_risk:
    min_labelled_cases: 30
    features: [severity_rank, days_open, days_to_due, discipline_index, evidence_completeness,
               open_actions, overdue_actions, missing_approvals, hypotheses_validated,
               read_across_gaps, supplier_dependency, similar_case_median_duration]

cockpit:
  on_time_target: 0.75
  on_time_baseline: 0.53
  export_dir: "out/cockpit"
